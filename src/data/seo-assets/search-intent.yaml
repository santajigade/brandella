seoTitle: "Search Intent Template and Guide for the AI Search Era"
h1: "Search Intent Kit: Excel Audit Template, Full Guide and AI Prompts"
focusKeyword: search intent template
description: "Free search intent template in Excel: classify queries from real SERPs, spot page mismatches and rank fixes. Includes a full guide and 22 AI prompts."
published: 2026-11-18
updated: 2026-11-18
time: 1 to 2 hours for a first audit of 30 queries
level: Beginner to advanced
kit: true
tabs: 9
intro:
  - "Most intent work stops at a label. This free <strong>search intent template</strong> goes further: an Excel audit that reads the real search results for each query, works out the dominant intent and how clear it is, recommends the page type Google rewards, checks your page against it and ranks the fixes. It comes with this step by step guide and 22 tested AI prompts."
  - "Intent matters more in the AI search era, not less. Google says AI Overviews and AI Mode may run several related searches across subtopics to build one answer. A page that matches what a query really wants is easier to rank, easier to quote and far more likely to turn a visit into a customer."
kitContents:
  - t: "Excel workbook, 9 tabs"
    d: "Intent Audit (500 ready rows with 16 automatic columns), Dashboard with two charts, Page Fit Plan, Intent Signals, Settings, AI Prompts, Checklist and Sources. Opens in Excel and Google Sheets."
  - t: "Worked demo inside"
    d: "30 realistic queries and 17 mapped URLs for a fictional coffee store, so you see every intent call, mismatch and fix working before you add your own data."
  - t: "Full guide (PDF)"
    d: "This complete guide as a printable PDF, to read offline or share with your team."
  - t: "22 AI prompts"
    d: "Prompts for intent classification, SERP reading, mixed intent, fan out questions, page rebuild briefs and AI answer checks, including a 5 prompt chained workflow."
  - t: "Printable checklist"
    d: "The whole intent audit on one page, to tick off on every project."
steps:
  - t: Add your brand names and cities
    d: "Open the Intent Signals tab and add your brand, product names and the cities you serve. The sheet uses these words to spot navigational and local intent before you even look at a SERP."
  - t: Paste your queries
    d: "Put one query per row in the Intent Audit with its topic, monthly volume and a business value from 1 to 3. Start with the 30 to 50 queries that matter most: money pages first, then your biggest guides."
  - t: Read the real results for each query
    d: "Search each query in a private window. Count the top 10 organic results by type (guides, lists and comparisons, product or tool pages, brand pages) and note whether a local pack or an AI Overview appears."
  - t: Record the top format and the angle
    d: "Choose the format most winners share, such as a best of list, a how to guide or a category page, and write the angle they have in common, such as prices in rupees or beginner friendly."
  - t: Check your page against the SERP
    d: "Add the URL that ranks or should rank, and choose what that page is today. The sheet shows Match, Close, Mismatch or No page yet, with a Fix priority score and a recommended action."
  - t: Find pages that serve too many intents
    d: "Open the Page Fit Plan. Any URL that carries queries with different dominant intents is flagged, so you can split it or add clear sections instead of forcing one page to do everything."
  - t: Fix in priority order and recheck
    d: "Work from Fix now down. Rebuild mismatched pages first, then create missing pages, then add answer blocks for queries with high AI answer exposure. Recheck the SERPs every quarter because intent drifts."
sections:
  - h: What changed about search intent in the AI search era
    html: |
      <p>Search intent is simply what the person behind a query wants. That has not changed. What changed is how many ways Google now has to satisfy it, and how much it costs you to get it wrong.</p>
      <p>Google explains that both AI Overviews and AI Mode <a href="https://developers.google.com/search/docs/appearance/ai-features" target="_blank" rel="noopener">may use a query fan out technique</a>, running several related searches across subtopics and sources while an answer is built. Its <a href="https://developers.google.com/search/docs/fundamentals/ai-optimization-guide" target="_blank" rel="noopener">guide to generative AI features</a> describes fan out as a set of concurrent, related queries generated by the model to request more information. In plain words: one question from a user becomes many smaller questions behind the scenes, and each of those has its own intent.</p>
      <p>Three practical consequences follow:</p>
      <ul>
        <li><strong>Format still decides who ranks.</strong> If most of the top 10 for a query are comparison lists, a product category page will struggle, however good it is. The workbook calls this a Mismatch.</li>
        <li><strong>Quick answer queries are exposed.</strong> When a query wants one fact and an AI Overview shows, the summary may satisfy many people on the results page. The sheet flags these as High AI answer exposure so you plan for a citation, not just a click.</li>
        <li><strong>Mixed intent pages are fragile.</strong> A page that tries to sell, compare and teach at once usually does none of them well. The Page Fit Plan finds those pages for you.</li>
      </ul>
      <p>Google also says there are no extra requirements or special optimizations needed to appear in AI Overviews or AI Mode. Matching intent well is normal SEO done properly, and it serves classic results and AI answers at the same time.</p>
  - h: The four intent types and how Google's raters see intent
    html: |
      <p>Most SEO tools use four types. Google's own <a href="https://services.google.com/fh/files/misc/hsw-sqrg.pdf" target="_blank" rel="noopener">Search Quality Rater Guidelines</a> use a slightly different set, and knowing both makes your calls sharper. In the full General Guidelines (September 2025 edition, section 12.7) raters think of queries as Know, Know Simple, Do, Website and Visit in person.</p>
      <div class="ra-sheet-wrap"><table class="ra-sheet">
        <thead><tr><th>Type in this kit</th><th>What the searcher wants</th><th>Rater guideline intent</th><th>Pages that usually win</th></tr></thead>
        <tbody>
          <tr><td>Informational</td><td>To learn, understand or fix something</td><td>Know, and Know Simple when the answer fits in 1 or 2 sentences or a short list</td><td>How to guides, explainers, tips lists, videos</td></tr>
          <tr><td>Commercial</td><td>To compare options before deciding</td><td>Know or Do, close to a purchase</td><td>Best of lists, comparisons, reviews, alternatives pages</td></tr>
          <tr><td>Transactional</td><td>To buy, book, download or use something now</td><td>Do</td><td>Product, category, pricing, tool and template pages</td></tr>
          <tr><td>Navigational</td><td>To reach one specific site or page</td><td>Website</td><td>Homepage, login, brand and contact pages</td></tr>
          <tr><td>Local (a flag in this kit)</td><td>A business or category of businesses nearby</td><td>Visit in person</td><td>Location pages, Business Profile, map pack listings</td></tr>
        </tbody>
      </table></div>
      <p>The guidelines also remind raters that many queries have more than one reasonable intent, and that a query can have a dominant interpretation (what most people mean), common interpretations and minor ones. That is why the workbook does not stop at one label: it measures how clear the intent is and lists secondary intents worth a section of their own.</p>
  - h: What is inside the search intent workbook
    html: |
      <div class="ra-sheet-wrap"><table class="ra-sheet">
        <thead><tr><th>Tab</th><th>What it does</th><th>What you type</th></tr></thead>
        <tbody>
          <tr><td>Intent Audit</td><td>Reads signal words, counts the SERP, works out dominant intent, clarity and secondary intents, recommends the page type, checks your page, scores and ranks the fix and writes the next action.</td><td>Query, topic, volume, value, SERP counts, local pack, AI Overview, top format, angle, your URL and page type</td></tr>
          <tr><td>Dashboard</td><td>Key numbers, intent and page fit tables, a topic table and two charts.</td><td>Only your topic names</td></tr>
          <tr><td>Page Fit Plan</td><td>One row per URL. Counts the intents mapped to each page, flags pages to split and tracks the fix.</td><td>URL, page type, planned fix, owner, due date</td></tr>
          <tr><td>Intent Signals</td><td>Editable signal word lists for each intent plus your brand and cities, and the rater guideline mapping.</td><td>Your brand names and cities</td></tr>
          <tr><td>Settings</td><td>Clarity thresholds, score weights, page types and their intent family, defaults and dropdown lists.</td><td>Optional tuning</td></tr>
          <tr><td>AI Prompts, Checklist, Sources</td><td>All 22 prompts, the process with automatic progress, and where every fact and assumption comes from.</td><td>Yes or No per step</td></tr>
        </tbody>
      </table></div>
      <p>Yellow cells are inputs. Grey cells under green headers are formulas, so you never break the logic by accident. All 500 rows already hold the formulas, dropdowns and checks.</p>
  - h: How the sheet decides intent (with a worked example)
    html: |
      <p>Every row goes through the same five steps:</p>
      <ol>
        <li><strong>Signal words.</strong> The query is checked against the word lists on the Intent Signals tab, in this order: navigational, transactional, commercial, informational. "brewnest login" is navigational because of the brand name. This is only a first guess.</li>
        <li><strong>SERP intent.</strong> The four SERP counts decide: guides and articles mean informational, lists and comparisons mean commercial, product, pricing and tool pages mean transactional, brand pages mean navigational. The biggest count wins. When you have not entered SERP counts yet, the signal word guess is used.</li>
        <li><strong>Clarity.</strong> The winning share of the counted results sets the clarity: 70 percent or more is Clear, 55 percent or more is Mostly clear, anything lower is Mixed. Any other type with 30 percent or more is listed as a secondary intent.</li>
        <li><strong>Page fit.</strong> Your page type is compared with the top format you saw. Same type is a Match. A different type of the same family (for example a tips list where how to guides win) is Close. A different family is a Mismatch.</li>
        <li><strong>Fix priority score.</strong> Volume (log scaled, full points at 20,000 searches, weight 30), business value (weight 30) and the page fit gap (Mismatch 1.0, No page yet 0.8, Close 0.5, Match 0.1, weight 40) are combined, then multiplied by a confidence factor: 1.0 for Clear, 0.85 for Mostly clear, 0.7 for Mixed. All of these are editable on Settings.</li>
      </ol>
      <p><strong>Worked example 1: a category page chasing a "best" query.</strong> In the demo, BrewNest wants "best espresso machine for home" (6,600 searches, business value 3) to rank with its espresso machines category page. The top 10 holds 2 guides, 7 best of lists and 1 product page, and an AI Overview shows.</p>
      <ul>
        <li>Signal words: "best" makes the first guess commercial.</li>
        <li>SERP intent: lists win with 7 of 10, so the dominant intent is commercial with a share of 70 percent, which is Clear. No other type reaches 30 percent, so secondary intents are None.</li>
        <li>Recommended page type: best of list. Your page is a category page, which belongs to the transactional family, so the fit is Mismatch.</li>
        <li>Score: volume points are log(6,601) divided by log(20,001), about 0.89. So (30 x 0.89 + 30 x 1 + 40 x 1) divided by 100, times 1.0 for Clear, gives 97. Priority: Fix now.</li>
      </ul>
      <p>The recommended action reads "Rebuild as best of list. The SERP rewards commercial pages." In practice you keep the category page for "espresso machine price" (where product pages win) and publish a separate best espresso machines guide that links to it. The Page Fit Plan shows exactly that: the espresso machines URL carries queries with 2 different intents.</p>
      <p><strong>Worked example 2: a true 50 and 50 split.</strong> "french press vs pour over" (1,000 searches, value 2) shows 5 guides and 5 comparison lists. Ties go to the leftmost column, so the dominant intent is informational at 50 percent, which is Mixed, with commercial listed as a secondary intent. There is no page yet, so the score is (30 x 0.70 + 30 x 0.67 + 40 x 0.8) divided by 100, times 0.7 for Mixed, which gives 51, priority Next. The action tells you to create a comparison and cover the commercial needs in their own section.</p>
      <p>Treat every number as a sorting aid. Your own judgement about the business always wins.</p>
  - h: Column by column guide to the Intent Audit
    html: |
      <div class="ra-sheet-wrap"><table class="ra-sheet">
        <thead><tr><th>Column</th><th>What goes in it</th><th>Tip</th></tr></thead>
        <tbody>
          <tr><td>Query, Topic, Volume</td><td>The exact query, the topic group and monthly searches.</td><td>One data source for all volumes.</td></tr>
          <tr><td>Business Value (1 to 3)</td><td>3 close to a sale or lead, 2 builds trust, 1 loosely related.</td><td>The most important judgement call.</td></tr>
          <tr><td>SERP counts (4 columns)</td><td>How many of the top 10 organic results are guides, lists or comparisons, product or tool pages, and brand pages.</td><td>Skip ads, maps and videos. Totals under 10 are fine.</td></tr>
          <tr><td>Local pack?, AI Overview?</td><td>Yes or No for what you saw above the results.</td><td>Search logged out in a private window.</td></tr>
          <tr><td>Top format seen, Content angle seen</td><td>The format most winners share and the angle they have in common.</td><td>The angle is the "why this one" of the winners: fresh, cheap, beginner, local.</td></tr>
          <tr><td>Your URL, Your page type</td><td>The page that ranks or should rank, and what it is today.</td><td>Leave blank if you have no page yet.</td></tr>
          <tr><td>Words in query</td><td>Automatic word count.</td><td>8 words or more is treated as a long conversational query.</td></tr>
          <tr><td>Word signal intent, SERP intent, Dominant intent</td><td>Automatic first guess, SERP verdict and final call.</td><td>The SERP always beats the words.</td></tr>
          <tr><td>Top type share, Intent clarity, Secondary intents</td><td>Automatic share of the winning type, the clarity band and any other intent worth a section.</td><td>Mixed queries need a page that serves both needs, or two pages.</td></tr>
          <tr><td>Local intent?, Funnel stage</td><td>Automatic local flag and funnel stage from the intent.</td><td>Local intent needs a location page and a Business Profile.</td></tr>
          <tr><td>Recommended page type, Page fit</td><td>Automatic: the format to build and how your page compares.</td><td>Mismatch is the most expensive problem in the sheet.</td></tr>
          <tr><td>AI answer exposure</td><td>Automatic High, Medium or Low.</td><td>High means informational with an AI Overview: plan an answer first block.</td></tr>
          <tr><td>Fix priority score, Priority, Recommended action</td><td>Automatic score from 0 to 100, Fix now, Next, Later or Monitor, and the next step in plain words.</td><td>Sort by score first.</td></tr>
          <tr><td>Duplicate check</td><td>Automatic warning when a query appears twice.</td><td>Delete or merge duplicates.</td></tr>
          <tr><td>Helper columns</td><td>Automatic counts of signal words found, at the far right.</td><td>Useful when a word guess looks wrong.</td></tr>
        </tbody>
      </table></div>
  - h: Reading a SERP for intent in 5 minutes
    html: |
      <p>The workbook needs four counts and two choices per query. This is the fastest reliable way to get them:</p>
      <ol>
        <li><strong>Search clean.</strong> Use a private window, your target country and language, and do not click anything first.</li>
        <li><strong>Note the features above the results.</strong> AI Overview, local pack, shopping results, People Also Ask. These tell you what Google thinks people want before they scroll.</li>
        <li><strong>Count the top 10 organic results by type.</strong> Guide or article, list or comparison or review, product or category or pricing or tool page, brand homepage or login. Ignore ads.</li>
        <li><strong>Find the shared format.</strong> Ahrefs calls this the <a href="https://ahrefs.com/blog/search-intent/" target="_blank" rel="noopener">three Cs of search intent</a>: content type, content format and content angle. Write down the format most winners share and the angle that keeps repeating in titles.</li>
        <li><strong>Check stability.</strong> If you track ranks, a SERP that reshuffles often usually means the intent is unclear or shifting. Note it and recheck sooner.</li>
      </ol>
      <p>Google's <a href="https://developers.google.com/search/docs/fundamentals/seo-starter-guide" target="_blank" rel="noopener">SEO Starter Guide</a> adds a useful reminder: experts and beginners use different words for the same thing (its example is "charcuterie" versus "cheese board"). When two phrasings show the same SERP, they share one intent and belong on one page.</p>
  - h: Reference table of page fit and what to do
    html: |
      <div class="ra-sheet-wrap"><table class="ra-sheet">
        <thead><tr><th>Page fit</th><th>What it means</th><th>Typical fix</th></tr></thead>
        <tbody>
          <tr><td>Match</td><td>Your page is the format the SERP rewards.</td><td>Beat the winners on depth, freshness and angle. Add an answer first block when AI answer exposure is High.</td></tr>
          <tr><td>Close</td><td>Same intent family, different format (tips list vs how to guide, category vs pricing page).</td><td>Reshape the layout: steps, a comparison table, a price section. Usually an edit, not a rewrite.</td></tr>
          <tr><td>Mismatch</td><td>Different intent family (category page for a "best" query, guide for a "buy" query).</td><td>Build the right page type, keep the old page for its own intent and link the two.</td></tr>
          <tr><td>No page yet</td><td>Nothing targets the query.</td><td>Create the recommended page type, or answer it inside a related page when the query is small.</td></tr>
          <tr><td>Mixed clarity</td><td>No type holds 55 percent of results.</td><td>Serve the dominant intent first and the secondary intent in its own clearly labelled section.</td></tr>
        </tbody>
      </table></div>
      <p>Before you build a new page for every variation, note Google's warning in its AI features guide: creating separate pages for each query variation does not help, and a high quantity of pages does not make a website higher quality. One strong page per intent is the goal.</p>
  - h: Search intent for AI answers (AEO)
    html: |
      <ul>
        <li><strong>Answer the dominant intent in the first lines.</strong> For informational queries with an AI Overview, open with a short, self contained answer, then give the depth a summary cannot: steps, numbers, examples and your own experience.</li>
        <li><strong>Plan for the fan out.</strong> List the follow up questions behind each important query (prompt 9 below) and make sure your page or cluster answers them. Our <a href="/resources/seo-aeo-assets/topic-clusters/">topic clusters kit</a> has a whole tab for this.</li>
        <li><strong>Do not rewrite for robots.</strong> Google's guide says AI systems understand synonyms and general meaning, and that there is no need to break content into tiny chunks. Write for the person and the intent.</li>
        <li><strong>Measure AI visibility.</strong> Google says traffic from AI features is included in the Search Console Performance report under the Web search type. Watch impressions and clicks for your High exposure queries after each fix.</li>
      </ul>
      <p>To go deeper, read how <a href="/how-google-ai-mode-decides-cite-websites/">Google AI Mode decides which websites to cite</a>.</p>
  - h: Your first 30 days with this kit
    html: |
      <ul>
        <li><strong>Week 1: pick and read.</strong> Choose 30 to 50 queries, starting with money pages and the guides that bring the most impressions. Fill the SERP counts, features, format and angle for each one.</li>
        <li><strong>Week 2: map and judge.</strong> Add your URLs and page types. Review every Mismatch and Mixed row by hand and confirm the call.</li>
        <li><strong>Week 3: fix the top 5.</strong> Rebuild or create the five Fix now pages. Use prompt 13 to draft a rebuild brief for each.</li>
        <li><strong>Week 4: split and answer.</strong> Work through the Page Fit Plan, split pages that serve several intents, and add answer first blocks to High exposure pages.</li>
      </ul>
      <p>After that, add new queries monthly and recheck the SERPs for your top queries every quarter.</p>
  - h: The chained prompt workflow (from query list to page fixes)
    html: |
      <p>Prompts 18 to 22 below are built to run in order in one AI chat. Each step uses the output of the one before:</p>
      <ol>
        <li><strong>Brief the assistant</strong> on your business, audience and market.</li>
        <li><strong>Classify</strong> your queries with a first intent guess and the reason.</li>
        <li><strong>Read the SERPs</strong> you paste in and correct the guesses.</li>
        <li><strong>Judge the fit</strong> of your current pages.</li>
        <li><strong>Plan the fixes</strong> as a table you can paste into the workbook.</li>
      </ol>
      <p>The AI never sees the live results, so always paste the real SERP notes in step 3. The assistant does the thinking work; the real results decide.</p>
  - h: Search intent mistakes to avoid
    html: |
      <ul>
        <li><strong>Labelling from the words alone.</strong> "Arabica vs robusta" looks commercial, but the demo SERP is mostly explainers. Always look at the results. Our guide to <a href="/what-is-search-intent-practical-guide/">what search intent means for SEO</a> covers more examples.</li>
        <li><strong>Forcing one page to serve every intent.</strong> A category page that also tries to be a buying guide and a how to article rarely ranks for any of them.</li>
        <li><strong>Building a page for every variation.</strong> Phrasings that show the same results share one intent and one page.</li>
        <li><strong>Ignoring the angle.</strong> Matching the format is half the job. If every winner shows prices in rupees or beginner steps, your page needs that too.</li>
        <li><strong>Forgetting local intent.</strong> A map pack means people want somewhere to go. Content alone will not win it.</li>
        <li><strong>Treating intent as permanent.</strong> SERPs change with seasons, news and new AI features. Recheck important queries every quarter.</li>
        <li><strong>Trusting AI for SERP facts.</strong> Assistants cannot see today's results reliably. Use them to reason about what you saw, not to tell you what ranks.</li>
      </ul>
prompts:
  - t: Classify intent with reasons
    p: |
      Act as a senior SEO strategist. Classify each query by search intent (informational, commercial, transactional, navigational)
      and add a local flag where people want a place nearby. For each one give a confidence (high, medium, low) and a one line reason.
      Mark queries that probably have mixed intent. Queries: [paste list]
      Return a table I can paste into Excel.
  - t: Read a SERP I describe
    p: |
      Here are the top 10 results I saw for "[query]" in [country]: [paste titles and URLs].
      Features above the results: [AI Overview, local pack, shopping, People Also Ask].
      Count the results by type (guide, list or comparison, product or tool page, brand page), name the dominant format,
      describe the shared content angle and say how clear the intent is.
  - t: Find the content angle of the winners
    p: |
      These are the titles and meta descriptions of the top 10 results for "[query]": [paste].
      What angle do most of them share (freshness, price, beginner, expert, local, speed)? What angle is missing that a better page could own?
  - t: Mixed intent planner
    p: |
      The query "[query]" shows a mixed SERP: [describe the split, for example 5 guides and 5 comparison lists].
      Suggest one page outline that serves the dominant intent first and the secondary intent in its own section.
      Then say when it would be better to build two separate pages instead.
  - t: Split a page that serves several intents
    p: |
      My page [URL] currently targets these queries: [paste queries with their intent].
      Group them by intent. Recommend which group the page should keep, which groups need a new page,
      and the internal links between them. Give a title and slug for each new page.
  - t: Know Simple check
    p: |
      For each query below, say whether most people would agree on a correct answer that fits in 1 or 2 sentences or a short list.
      Mark those as quick answer queries and suggest what extra value a page could give beyond the short answer: [paste list]
  - t: Answer first block for an intent
    p: |
      Write a 40 to 60 word opening for a page targeting "[query]" with [intent] intent.
      It must answer the query fully on its own, in plain language, then hint at the deeper help the page gives.
      No fluff, no claims I cannot back up.
  - t: Commercial intent page outline
    p: |
      The query "[query]" rewards [best of list or comparison] pages. Write an outline for one that helps a buyer decide:
      selection criteria, how we tested or chose, a comparison table, who each option suits, and an honest verdict.
      My business sells [what you sell], so note where disclosure is needed.
  - t: Fan out questions behind a query
    p: |
      A person asks an AI assistant "[query]". List 12 follow up questions the system might also need to answer to give
      a complete response (subtopics, comparisons, costs, steps, risks). Mark which ones my page [URL] already answers: [paste page headings].
  - t: Transactional page checklist
    p: |
      For the transactional query "[query]", list what the page must show above the fold for a ready buyer
      (price, stock, delivery, trust, options, call to action) and what can go lower. Compare with my page: [paste page summary].
  - t: Navigational and brand query audit
    p: |
      These queries include my brand [brand]: [paste list]. For each, say which page should rank (home, login, pricing, reviews, contact)
      and whether my site has a clear page for it. Flag any brand query where a third party site would likely outrank me.
  - t: Local intent check
    p: |
      Which of these queries suggest the searcher wants a place nearby or a local provider? [paste list]
      For each local one, say whether I need a location page, a Business Profile update or both. I serve [cities].
  - t: Rebuild brief for a mismatched page
    p: |
      My page [URL] is a [current page type], but the SERP for "[query]" rewards [recommended page type] with this angle: [angle].
      Write a rebuild brief: new title, H2 outline, what to keep, what to move to another page, the answer first block, and FAQs.
  - t: Intent drift check
    p: |
      Last quarter the top 10 for "[query]" was: [paste]. Today it is: [paste].
      Describe how the intent or format changed, what likely caused it, and what my page [URL] should change.
  - t: Long conversational query mapping
    p: |
      Here are long, conversational questions from my site search, support chats and Search Console: [paste].
      For each, give the short query it maps to, the intent, and whether it deserves its own page, a section or a FAQ answer.
  - t: Signal words for my niche
    p: |
      My niche is [niche] in [country]. List words and short phrases that signal each intent in this niche:
      transactional, commercial, informational, navigational (my brands are [brands]) and local (my cities are [cities]).
      Keep each phrase to 1 to 3 words so I can paste them into my Intent Signals tab.
  - t: Funnel balance review
    p: |
      Here are my queries with their dominant intent and business value: [paste table].
      Is my plan balanced across learn, compare and buy? Which stage is missing pages, and which 5 pages would fix that first?
  - t: "Workflow 1 of 5: brief the assistant"
    p: |
      You are my search intent analyst. My business: [what you sell]. Audience: [who]. Country and language: [market].
      My brands: [brands]. Goal: [leads, sales or readers]. Confirm you understand, then wait for the next step.
  - t: "Workflow 2 of 5: first guess"
    p: |
      Here are my queries: [paste list]. Give each a first intent guess (informational, commercial, transactional, navigational),
      a local flag and a one line reason. Mark the ones you are least sure about.
  - t: "Workflow 3 of 5: correct with real SERPs"
    p: |
      Here are my notes from the real results for each query (counts by type, top format, angle, AI Overview, local pack): [paste].
      Correct your first guesses where the results disagree, and show the dominant intent, clarity and any secondary intent.
  - t: "Workflow 4 of 5: judge my pages"
    p: |
      Here is the page I use for each query and what it is today: [paste query, URL, page type].
      Rate each as Match, Close, Mismatch or No page yet against the recommended format, and flag URLs that serve more than one intent.
  - t: "Workflow 5 of 5: fix plan for Excel"
    p: |
      Turn everything above into a fix plan table I can paste into my workbook, with tabs between columns:
      Query, Dominant intent, Recommended page type, Page fit, Recommended action, Target URL, Priority (Fix now, Next, Later).
      Sort by priority, then by business value.
checklist:
  - Added my brand names and cities on the Intent Signals tab
  - Listed my 30 to 50 most important queries with volume and business value
  - Searched every query in a private window in my target country
  - Counted the top 10 results by type for every query
  - Noted local pack and AI Overview for every query
  - Recorded the top format and the shared content angle
  - Added the URL and current page type for each query
  - Reviewed every Mismatch row by hand and confirmed it
  - Reviewed every Mixed row and planned a section for the secondary intent
  - Split or restructured URLs flagged on the Page Fit Plan
  - Rebuilt or created the Fix now pages first
  - Added answer first blocks to pages with High AI answer exposure
  - Linked location pages and Business Profile for local intent queries
  - Checked Search Console (Web search type) clicks and impressions after each fix
  - Set a date to recheck the SERPs for top queries next quarter
faq:
  - q: Is this search intent template free?
    a: "Yes. The Excel workbook, PDF guide, prompts and checklist are free to download and use for your own sites and for clients, with no sign up."
  - q: Can the template classify intent automatically?
    a: "Partly. Signal words in the query give an automatic first guess, and that guess is often right. The reliable call comes from the SERP counts you enter, because the results Google shows today are the best evidence of what searchers want."
  - q: Why do I have to look at the search results myself?
    a: "Because intent is decided by what ranks, not by the words. Two similar queries can show completely different pages. Counting the top 10 takes a few minutes per query and saves you from building the wrong page."
  - q: What should I do with mixed intent queries?
    a: "Serve the dominant intent first and give the secondary intent its own clearly labelled section. If the two needs are very different, such as a buying guide and a product page, build two pages and link them."
  - q: Does search intent matter for AI Overviews and AI Mode?
    a: "Yes. Google says these features may run several related searches across subtopics, and there are no special optimizations beyond good SEO. A page that matches intent and answers the follow up questions clearly is easier to rank and easier to cite."
  - q: Does the workbook open in Google Sheets?
    a: "Yes. Upload the .xlsx file to Google Drive and open it with Google Sheets. Formulas, dropdowns and colours carry over. The charts may need a quick refresh."
