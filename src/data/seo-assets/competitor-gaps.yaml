seoTitle: "Keyword Gap Analysis Template: Free Competitor Gap Sheet"
h1: Free Keyword Gap Analysis Template for Competitor Gaps
focusKeyword: keyword gap analysis template
description: "Find keywords your competitors rank for and you do not. Free keyword gap analysis template with gap types, actions, 5 AI prompts and a checklist."
published: 2026-11-17
updated: 2026-11-17
time: 60 minutes
level: Intermediate
intro:
  - "Your competitors have already tested which topics bring them traffic. This free <strong>keyword gap analysis template</strong> lines up their rankings next to yours, labels every gap, and turns it into a clear action: create, improve or ignore."
  - "You can fill it from any SEO tool that shows competitor rankings, or by hand for a short list of important keywords."
template:
  name: Keyword Gap Sheet
  intro: "One row per keyword. Put competitor positions side by side with yours, then use the <strong>Gap Type</strong> rules below to decide the action."
  columns: [Keyword, Monthly Volume, Competitor A Rank, Competitor B Rank, Our Rank, Gap Type, Action, Target URL, Priority]
  rows:
    - [seo audit checklist, 2900, 3, 7, Not ranking, Missing, Create new page, /seo-audit-checklist/, High]
    - [local seo tips, 1600, 5, 12, 24, Weak, Improve existing page, /local-seo-tips/, High]
    - [schema markup generator, 4400, 2, 9, 11, Weak, Improve existing page, /tools/schema-generators/, Medium]
    - [what is seo, 22000, 6, 4, 3, Strong, Protect and refresh, /what-is-seo/, Low]
    - [seo agency pricing, 1300, 4, 8, Not ranking, Missing, Skip (not our offer), (none), Skip]
  note: "Example rows with made up numbers. Use the same tool, country and date for every position you record."
steps:
  - t: Pick 2 or 3 real search competitors
    d: "Choose sites that rank for your topics, not only your business rivals. A blog or publisher can be your biggest search competitor."
  - t: Export their ranking keywords
    d: "Use any SEO tool's competitor or organic keywords report. Google's <a href=\"https://support.google.com/google-ads/answer/7337243\" target=\"_blank\" rel=\"noopener\">Keyword Planner</a> also accepts a website address to suggest keyword ideas, though it does not show rankings."
  - t: Add your own positions
    d: "Pull your positions from the same tool, or from the Queries report in Google Search Console."
  - t: Label each gap
    d: "Missing means you do not rank at all. Weak means you rank but outside the top 10. Strong means you already beat or match them."
  - t: Decide the action
    d: "Create a page for valuable missing keywords, improve the existing page for weak ones, and protect strong ones with regular refreshes."
  - t: Filter by relevance before volume
    d: "Skip gaps that do not fit what you sell or teach. A relevant keyword with lower volume beats a popular one your audience does not need."
sections:
  - h: The three gap types and what to do
    html: |
      <div class="ra-sheet-wrap"><table class="ra-sheet">
        <thead><tr><th>Gap type</th><th>What it means</th><th>Usual action</th></tr></thead>
        <tbody>
          <tr><td>Missing</td><td>Competitors rank, you have no ranking page</td><td>Create a new page that clearly beats theirs</td></tr>
          <tr><td>Weak</td><td>You rank, but below the top 10</td><td>Improve the page: depth, intent match, internal links</td></tr>
          <tr><td>Strong</td><td>You rank at or above competitors</td><td>Refresh regularly and add internal links to it</td></tr>
        </tbody>
      </table></div>
      <p>Weak gaps are often the fastest wins, because Google already sees your page as relevant. Our guide to <a href="/content-gap-analysis/">content gap analysis</a> covers the content side in more depth.</p>
  - h: Look beyond keywords
    html: |
      <p>Keyword gaps tell you where competitors win. Their backlinks often tell you why. Pair this sheet with a <a href="/competitor-backlink-analysis/">competitor backlink analysis</a> to see which pages earn links and why.</p>
      <p>For large sites, you can collect competitor titles and headings automatically with a small script, as shown in our <a href="/web-scraper-for-competitor-content-audits/">competitor content audit scraper</a> tutorial.</p>
prompts:
  - t: Identify true search competitors
    p: |
      My website is [URL] and it covers [topics]. Suggest the types of websites that likely compete with me in Google
      for these topics (publishers, tools, forums, brands), and how to confirm each one using search results.
  - t: Analyze a gap list
    p: |
      Here is a keyword gap export with columns keyword, volume, competitor ranks and our rank: [paste data]
      Label each keyword Missing, Weak or Strong, suggest an action, and rank the top 15 opportunities for a site about [topic].
  - t: Why does the competitor rank?
    p: |
      Here is the outline and summary of a competitor page ranking for "[keyword]": [paste]
      And here is my page: [paste]. List the specific differences that likely explain their better ranking,
      and the 5 most important improvements for my page.
  - t: Turn gaps into a content plan
    p: |
      Turn these missing keywords into a 4 week content plan for a small team: [paste keywords]
      Group keywords that belong on one page, and order the plan by value and effort.
  - t: Relevance filter
    p: |
      My business sells [offer] to [audience]. From this keyword list, remove anything that would bring visitors
      who could never become customers or loyal readers, and explain each removal in a few words: [paste list]
checklist:
  - Chose 2 or 3 real search competitors
  - Exported competitor keywords from one tool and one country
  - Added our own positions from the same source or Search Console
  - Labelled every keyword Missing, Weak or Strong
  - Removed keywords that do not fit our offer or audience
  - Assigned an action and a target URL to each gap
  - Prioritized weak gaps where we already rank
  - Checked competitor backlinks for the top gaps
faq:
  - q: What is a keyword gap analysis?
    a: "It compares the keywords your competitors rank for with the keywords you rank for, so you can see topics you are missing and pages that need work."
  - q: Can I do a keyword gap analysis for free?
    a: "Yes, on a small scale. Search your key topics manually, note who ranks, and compare with your own Search Console queries. Paid tools make it faster for large lists."
  - q: How often should I run a keyword gap analysis?
    a: "Every 3 to 6 months is enough for most sites, or whenever a new competitor starts appearing in your search results."
  - q: Should I copy what competitors publish?
    a: "No. Use their rankings to find the topic, then publish something more useful, more current or more specific to your audience."
