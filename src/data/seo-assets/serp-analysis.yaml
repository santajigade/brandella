seoTitle: "SERP Analysis Template: Free Sheet to Break Down Page One"
h1: Free SERP Analysis Template to Break Down Page One
focusKeyword: serp analysis template
description: "Break down the top 10 Google results for any keyword. Free SERP analysis template with page type, format, SERP features and gap columns, plus AI prompts."
published: 2026-11-17
updated: 2026-11-17
time: 30 minutes per keyword
level: Intermediate
intro:
  - "Before you write, look at who already wins. This free <strong>SERP analysis template</strong> gives you a repeatable way to study the top 10 results for a keyword: what kind of pages rank, what they cover, which search features appear, and where a better page could fit."
  - "Ten minutes of SERP analysis often saves days of writing the wrong kind of page."
template:
  name: SERP Analysis Sheet
  intro: "Use one tab per keyword. Record the top 10 organic results plus any search features above them, then fill the <strong>Gap We Can Fill</strong> column last."
  columns: [Position, URL, Site Type, Page Format, Approx. Length, Last Updated, SERP Features Nearby, Why It Ranks, Gap We Can Fill]
  rows:
    - [AI Overview, (summary), Google feature, Short answer, n/a, n/a, Cites 4 sources, "Clear definitions on cited pages", Give a quotable 2 sentence answer]
    - [1, example-publisher.com/guide, Publisher, Long guide, 3000 words, 2026, "People Also Ask", "Depth, strong links, updated often", Add templates and real examples]
    - [2, example-tool.com/blog, SaaS blog, How to guide, 2000 words, 2025, Video carousel, Screenshots of each step, "Fresher screenshots, a free template"]
    - [3, forum.example.com/thread, Forum, Discussion, n/a, 2026, None, First hand experience, Add real case studies]
    - [4, example-agency.com/checklist, Agency, Checklist, 1200 words, 2024, None, Scannable checklist, "Checklist plus why each step matters"]
  note: "Example rows with placeholder sites. Record what you see in the country and device you target."
steps:
  - t: Search like your customer
    d: "Use a private window, the right country and the device most of your audience uses. Mobile and desktop results can differ."
  - t: Log search features first
    d: "Note anything above or between results: an AI Overview, featured snippet, People Also Ask, videos, images, local map or shopping results."
  - t: Record the top 10 organic results
    d: "For each result, note the site type (publisher, brand, tool, forum), the page format and roughly how long and how fresh it is."
  - t: Write why each one ranks
    d: "Look for the obvious strengths: depth, original data, tools, strong brand, fresh updates or first hand experience."
  - t: Find the gap
    d: "Ask what a searcher still cannot get from these pages. That gap becomes your angle, such as a template, a calculator or real examples."
  - t: Decide if the keyword is worth it
    d: "If page one is full of very strong brands and your site is new, consider a more specific long tail keyword instead."
sections:
  - h: SERP features to record
    html: |
      <ul>
        <li><strong>AI Overview or AI Mode answer.</strong> Note which sites are cited and what kind of content they quote.</li>
        <li><strong>Featured snippet.</strong> Note its format: paragraph, list or table. You can target the same format.</li>
        <li><strong>People Also Ask.</strong> Copy the questions. They are ready made H2s and FAQ entries.</li>
        <li><strong>Videos, images and local pack.</strong> These tell you which formats Google thinks searchers want.</li>
      </ul>
      <p>Google states that there are no extra requirements and no special optimization needed to appear in AI Overviews or AI Mode, and that normal SEO best practices still apply. See <a href="https://developers.google.com/search/docs/appearance/ai-features" target="_blank" rel="noopener">AI features and your website</a> on Google Search Central. Our guide on <a href="/ai-overviews-clicks-how-to-get-cited-2026/">getting cited in AI Overviews</a> covers practical steps.</p>
  - h: Turning SERP analysis into a better page
    html: |
      <p>Your sheet should end with a short brief: the format to use, the must cover subtopics that every top result shares, and the one thing your page will do better. Write your title last, and test it in our free <a href="/tools/seo-tools/serp-snippet-preview/">SERP snippet preview tool</a>.</p>
      <p>For title ideas that earn clicks in a crowded results page, see our tips on <a href="/title-tag-optimization/">title tag optimization</a>.</p>
prompts:
  - t: Summarize a SERP
    p: |
      Here are the top 10 Google results for "[keyword]" with title, URL and meta description: [paste]
      Summarize: dominant intent, winning page format, common subtopics every result covers,
      and 3 gaps that a new page could fill.
  - t: Build a brief from the SERP
    p: |
      Using this SERP analysis: [paste your sheet rows], write a content brief for a page targeting "[keyword]".
      Include the format, H2 outline, must cover subtopics, the unique angle, and FAQ questions from People Also Ask.
  - t: Featured snippet answer
    p: |
      The featured snippet for "[keyword]" is a [paragraph, list or table]. Write a better answer in the same format,
      under 50 words for a paragraph or 8 items for a list, accurate and easy to quote.
  - t: Compare my page with page one
    p: |
      My page: [paste outline or text]. Top ranking pages: [paste outlines].
      What important subtopics, examples or formats is my page missing? List the 5 highest impact fixes.
  - t: Is this keyword realistic?
    p: |
      Page one for "[keyword]" is: [paste site types and brands]. My site is [describe size and authority].
      Is ranking realistic in 6 months? If not, suggest 5 more specific long tail keywords with similar intent.
checklist:
  - Searched in a private window for the right country and device
  - Logged every SERP feature above and between results
  - Recorded site type, format, length and freshness for the top 10
  - Wrote down why each top result ranks
  - Copied People Also Ask questions for FAQ ideas
  - Identified at least one clear gap to fill
  - Decided if the keyword is realistic for our site
  - Turned the analysis into a short content brief
faq:
  - q: What is SERP analysis?
    a: "SERP analysis means studying the search engine results page for a keyword to understand what ranks, why it ranks, and what a new page must offer to compete."
  - q: How many results should I analyze?
    a: "The top 10 organic results plus the search features on page one are enough for most keywords. Look extra closely at the top 3."
  - q: Do I need special optimization for AI Overviews?
    a: "Google says no special optimization is required and standard SEO best practices apply. Clear, accurate, well structured answers make your page easier to understand and quote."
  - q: How often should I redo SERP analysis?
    a: "Redo it before refreshing an important page, and whenever rankings drop suddenly, because the results page itself may have changed."
