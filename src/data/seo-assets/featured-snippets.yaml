faq:
  - q: Is this featured snippet template really free?
    a: "Yes. The Excel workbook, PDF guide, prompts and checklist are free to download and use for your own sites and for clients, with no sign up."
  - q: How do I get a featured snippet on Google?
    a: "Rank in the top 10 for the query, make sure the page allows snippets, then answer the question right under a question heading in the format Google already shows, at the right length. Google decides who gets the snippet; you cannot mark a page as one."
  - q: How long should a featured snippet answer be?
    a: "Google gives no limit. Public studies found paragraph snippets of about 40 to 55 words in 2 or 3 sentences, lists of up to 8 items and tables of up to 5 rows. The workbook uses these as editable starting points."
  - q: Is there schema markup for featured snippets?
    a: "No. Google says you cannot mark your page as a featured snippet. Clear headings, a direct answer and real HTML lists and tables help; structured data is for other rich results."
  - q: Do featured snippets still matter with AI Overviews?
    a: "They show far less often than before, but a page must be eligible to show a snippet to be a supporting link in AI Overviews or AI Mode. The same clear answer blocks help with both, so the kit tracks both."
  - q: Does the workbook work in Google Sheets?
    a: "Yes. Upload the .xlsx file to Google Drive and open it with Google Sheets. Formulas, dropdowns and colours carry over. The charts may need a quick refresh."
