name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SSH_HOST: 92.249.46.120
  SSH_PORT: "65002"
  SSH_USER: u557329885
  # Confirmed from the hPanel File Manager screenshot before the first deploy
  REMOTE_DIR: domains/brandella.in/public_html
  # SHA256 ED25519 fingerprint shown in hPanel > SSH Access. Deploy is skipped while empty.
  HOST_FINGERPRINT: "SHA256:NVYjqWkmDu8zJlqJ47rWJWGWev9j1Rqius7bBICJVWw"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Safety checks
        run: |
          if [ -e dist/tools ]; then echo "dist/tools exists. The site must never write to /tools/"; exit 1; fi
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/sitemap-index.xml

      - name: Check deploy settings
        id: cfg
        run: |
          if [ -z "$HOST_FINGERPRINT" ] || [ -z "${{ secrets.SSH_KEY != '' && 'yes' || '' }}" ]; then
            echo "::notice::Build is fine. Deploy skipped: HOST_FINGERPRINT or the SSH_KEY secret is not set yet."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify server host key
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null > /tmp/host_key
          test -s /tmp/host_key || { echo "Could not read the server host key"; exit 1; }
          GOT=$(ssh-keygen -lf /tmp/host_key | awk '{print $2}')
          WANT="$HOST_FINGERPRINT"
          case "$WANT" in SHA256:*) ;; *) WANT="SHA256:$WANT" ;; esac
          echo "Server: $GOT"
          echo "Expected: $WANT"
          if [ "$GOT" != "$WANT" ]; then echo "Host key fingerprint does not match. Aborting."; exit 1; fi
          cat /tmp/host_key >> ~/.ssh/known_hosts

      - name: Upload with rsync (no --delete)
        if: steps.cfg.outputs.ready == 'yes'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Never use --delete: WordPress files, uploads and /tools/ must stay on the server.
          rsync -rlvz --checksum --exclude='/tools/' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          rm -f ~/.ssh/id_deploy
