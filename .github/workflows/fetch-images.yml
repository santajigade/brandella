name: Fetch WordPress images (one time)

# Run this once BEFORE the switch is final, while WordPress still serves the images.
# It downloads every image listed in scripts/wp_images.txt into public/wp-content/uploads/,
# makes small WebP card thumbnails in public/thumbs/, commits them and starts a deploy.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        run: |
          fails=0
          while read -r path; do
            [ -z "$path" ] && continue
            out="public$path"
            [ -s "$out" ] && continue
            mkdir -p "$(dirname "$out")"
            if ! curl -fsSL --retry 3 -A "Mozilla/5.0 (BrandellaMigration)" -o "$out" "https://brandella.in$path"; then
              echo "::warning::Failed $path"; rm -f "$out"; fails=$((fails+1))
            fi
          done < scripts/wp_images.txt
          echo "Failed downloads: $fails"

      - name: Make thumbnails
        run: |
          pip install --quiet pillow
          python3 scripts/make_thumbs.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wp-content public/thumbs
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Add WordPress images and card thumbnails"
          git push

      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
